name: Apply monthly hotfix

on:
  push:
    paths:
      - hotfix_missing_monthly.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python hotfix_missing_monthly.py
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile main.py balance_logic.py balance_monitor.py
      - name: Commit tested hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py tests/test_helpers_and_alerts.py
          git commit -m "Handle missing monthly percentages safely" || exit 0
          git push
