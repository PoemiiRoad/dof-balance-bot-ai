name: Apply maintenance

on:
  workflow_dispatch:
  push:
    paths:
      - 'maintenance_patch.py*'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python maintenance_patch_v3.py
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile main.py balance_logic.py balance_monitor.py
      - name: Commit tested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py balance_logic.py balance_monitor.py tests README.md CLAUDE_PRO_SETUP.md .gitignore .env.example
          git commit -m "Harden bot data handling and AI runtime" || exit 0
          git push
